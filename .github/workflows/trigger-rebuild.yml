name: Trigger website rebuild

on:
  push:
    branches: [main]
    paths:
      - "**.md"
  workflow_dispatch:

jobs:
  ping-deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL repo secret is not set."
            echo "Create one at:"
            echo "  Vercel project → Settings → Git → Deploy Hooks → Create Hook (branch: main)"
            echo "Then add it to this repo:"
            echo "  Settings → Secrets and variables → Actions → New repository secret"
            echo "  Name: VERCEL_DEPLOY_HOOK_URL"
            exit 1
          fi
          echo "Pinging deploy hook..."
          response=$(curl -sS -o /tmp/deploy-resp -w "%{http_code}" -X POST "$DEPLOY_HOOK_URL")
          echo "HTTP $response"
          cat /tmp/deploy-resp
          echo
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            exit 1
          fi
